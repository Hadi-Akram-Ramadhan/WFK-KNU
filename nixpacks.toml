[variables]
NIXPACKS_PHP_ROOT_DIR = "public"

[phases.setup]
nixPkgs = ["php82", "php82Packages.composer", "nodejs_20", "nginx"]

[phases.install]
cmds = [
    "mkdir -p database storage/framework/views storage/framework/cache storage/framework/sessions storage/logs",
    "touch database/database.sqlite",
    "composer install --ignore-platform-reqs --no-dev --optimize-autoloader",
    "npm install"
]

[phases.build]
cmds = [
    "npm run build",
    "php artisan config:cache",
    "php artisan route:cache",
    "php artisan view:cache",
    "php artisan migrate --force"
]

[start]
cmd = "php artisan queue:work database --tries=2 --timeout=90 --sleep=3 --max-jobs=500 --memory=128 & php artisan serve --host=0.0.0.0 --port=8080"

